const tabItem=id=>S.tabela.find(x=>x.id===id);
function valorItem(it){if(it.terc)return 0;const t=tabItem(it.t);if(!t)return 0;const q=num(it.qtd)||1;if(t.un==='un')return q*t.preco;return Math.max(num(it.med),1)*q*t.preco*(it.lam?1.4:1)}
function totais(o){const sub=o.itens.reduce((a,i)=>a+valorItem(i),0)*(o.dir==='B'?1.22:1);const p=o.perc;const pend=Object.entries(p).filter(([k,v])=>v===''||v==null).map(([k])=>k);
 const neg=num(p.neg)/100;let base=sub*(1-neg);const add=['rt','noturno','nf','ipi'].reduce((a,k)=>a+base*num(p[k])/100,0);const total=base+add;
 return{sub,total,pend,min:o.base==='foto'?total*.9:total,max:o.base==='foto'?total*1.15:total}}
/* ===== estado/ações ===== */
function evt(t,tipo,go,pp){S.avisos.unshift({id:uid('A'),t,tipo,lido:false,q:now(),go,pp})}
function toast(t,bad){const d=document.createElement('div');d.className='toast'+(bad?' r':'');d.textContent=t;document.getElementById('toasts').appendChild(d);setTimeout(()=>d.remove(),3200)}
function go(screen,p={}){S.screen=screen;S.p=p;render();const c=document.querySelector('.col');if(c)c.scrollTop=0}
function ask(title,fields,ok,onok){S.modal={title,fields,ok,onok};drawModal()}
function drawModal(){const m=document.getElementById('modal');if(!S.modal){m.className='';m.innerHTML='';return}const f=S.modal;
 m.className='on';m.innerHTML=`<div class="mbox"><h3>${esc(f.title)}</h3>${(f.fields||[]).map(x=>`<div class="f"><div class="lbl">${esc(x.l)}</div>${x.t==='select'?`<select id="mf_${x.k}">${x.o.map(o=>`<option>${esc(o)}</option>`).join('')}</select>`:x.t==='text'?`<div>${x.v}</div>`:`<input id="mf_${x.k}" value="${esc(x.v||'')}" placeholder="${esc(x.ph||'')}">`}</div>`).join('')}<div class="a"><button class="btn s" data-a="mcancel">Cancelar</button><button class="btn" data-a="mok">${esc(f.ok)}</button></div></div>`;
 const first=m.querySelector('input,select');if(first)first.focus()}
const A={
 mcancel(){S.modal=null;drawModal()},
 mok(){const f=S.modal;const v={};(f.fields||[]).forEach(x=>{const el=document.getElementById('mf_'+x.k);if(el)v[x.k]=el.value});S.modal=null;drawModal();f.onok(v)},
 nav(d){go(d.s,d.p?JSON.parse(d.p):{})},
 tab(d){S.p.tab=d.t;render()},
 papel(d,el){S.role=el.value;toast('Papel de demonstração: '+S.role);if(!can('ver'))S.role='leitura';render()},
 login(){const u=document.getElementById('lu').value.trim(),s=document.getElementById('ls').value;
  if(Date.now()<S.bloq){toast('Acesso bloqueado por 5 minutos (demonstração).',1);return}
  const us=S.users.find(x=>x.u===u&&x.on);if(us&&s.length>=8){S.logged=true;S.user=us.u;S.role=us.papel;S.erros=0;go('inicio')}
  else{S.erros++;if(S.erros>=5){S.bloq=Date.now()+300000;S.erros=0;toast('5 erros seguidos: bloqueado por 5 minutos.',1)}else toast('Usuário ou senha incorretos. Depois de 5 erros seguidos o acesso fica bloqueado por 5 minutos. ('+S.erros+'/5)',1);render()}},
 logout(){S.logged=false;go('login')},
 /* orçamentos */
 orcNovo(){ask('Novo orçamento',[{l:'Obra',k:'n',ph:'Ex.: Cozinha (exemplo)'},{l:'Mercado',k:'m',t:'select',o:['BR','USA']},{l:'Origem',k:'o',t:'select',o:['Manual','Lead qualificado (ATENDIMENTO)']}],'Criar',v=>{if(!v.n){toast('Dê um nome à obra.',1);return}const id='O-'+String(104+S.orcs.length-3).padStart(4,'0');S.orcs.unshift({id,nome:v.n,estado:'em orçamento',versao:1,base:'medida',mercado:v.m,dir:'A',perc:{neg:'',rt:'',noturno:'',nf:'',ipi:''},itens:[],versoes:[{v:1,quando:now(),motivo:'primeira versão'}]});go('orc',{id,tab:'itens'})})},
 orcAbrir(d){go('orc',{id:d.id,tab:'itens'})},
 itemAdd(d){const o=orc();const cods=o.itens.map(i=>i.cod);let n=cods.length+1,c;do{c='MA'+String(n++).padStart(2,'0')}while(cods.includes(c));o.itens.push({cod:c,t:'AA',med:1,qtd:1,lam:false});render()},
 itemTerc(){ask('Item de terceiro',[{l:'Descrição (pedra, vidro, eletro, decoração)',k:'n'}],'Adicionar',v=>{if(v.n){orc().itens.push({cod:'T'+String(orc().itens.filter(i=>i.terc).length+1).padStart(2,'0'),nome:v.n,terc:true});render()}})},
 itemDel(d){orc().itens.splice(+d.i,1);render()},
 itemSet(d,el){const it=orc().itens[+d.i];const k=d.k;it[k]=el.type==='checkbox'?el.checked:(k==='t'?el.value:el.value);render()},
 percSet(d,el){orc().perc[d.k]=el.value.trim();render()},
 percZero(){Object.keys(orc().perc).forEach(k=>{if(orc().perc[k]==='')orc().perc[k]='0'});render()},
 baseSet(d,el){orc().base=el.value;render()},
 dirSet(d){orc().dir=d.v;render()},
 mercSet(d){orc().mercado=d.v;render()},
 cambio(d,el){S.cambio=num(el.value)||5.6;render()},
 versaoNova(){ask('Nova versão do orçamento',[{l:'Motivo',k:'m',ph:'Por que mudou?'}],'Salvar versão',v=>{if(!v.m){toast('Informe o motivo.',1);return}const o=orc();o.versao++;o.versoes.unshift({v:o.versao,quando:now(),motivo:v.m});toast('Versão '+o.versao+' salva');render()})},
 enviar(){const o=orc();o.estado='enviado';evt('Orçamento '+o.id+' enviado ao cliente','orçamento','orc',{id:o.id,tab:'itens'});toast('Orçamento enviado. O aviso foi para a central.');render()},
 aprovado(){const o=orc();o.estado='aprovado';const id='PED-'+String(300+S.pedidos.length+1).padStart(4,'0');o.pedido=id;
  S.pedidos.unshift({id,nome:o.nome,orc:o.id,rev:0,revs:[],termo:false,moveis:o.itens.filter(i=>!i.terc).map(i=>{const t=tabItem(i.t);return{cod:i.cod,nome:t.nome,larg:Math.round(num(i.med)*1000)||1000,alt:t.un==='ml'?900:720,prof:560,esp:18,prat:1,portas:2,gav:0,led:false,vent:true,vao:0,status:'rascunho',ia:false}}),med:{ck:{'Reforços no drywall conferidos':false,'Pé-direito medido':false,'Fotos com medidas escritas':false,'Duas leituras por cota':false},cotas:[],assin:''},lotes:[]});
  evt('Pedido '+id+' aberto a partir de '+o.id,'pedido','ped',{id,tab:'moveis'});toast('Aprovado! O pedido '+id+' foi aberto em PROJETOS.');go('ped',{id,tab:'moveis'})},
 mudanca(){ask('Cliente pediu mudança',[{l:'O que mudou?',k:'m'}],'Nova versão',v=>{const o=orc();o.estado='em orçamento';o.versao++;o.versoes.unshift({v:o.versao,quando:now(),motivo:v.m||'mudança pedida'});toast('Voltou para em orçamento, versão '+o.versao);render()})},
 perdido(){ask('Marcar como perdido',[{l:'Motivo',k:'m',t:'select',o:['Preço','Prazo','Escolheu outro','Desistiu','Outro']}],'Arquivar',v=>{const o=orc();o.estado='perdido';o.motivo=v.m;toast('Arquivado como perdido: '+v.m);render()})},

 cotaSet(d,el){ped().med.cotas[+d.i].obra=num(el.value);render()},
 assin(d,el){ped().med.assin=el.value},
 medRegistrar(){const P=ped();P.med.cotas.forEach(c=>{const m=P.moveis.find(x=>c.t.toLowerCase().includes(x.nome.toLowerCase().split(' ')[0])||false);if(m)m.vao=c.obra});
  const bad=P.moveis.filter(m=>conferir(m).some(x=>x.id==='R02'&&x.nivel==='erro'));
  if(bad.length){evt('Não cabe: '+bad.map(m=>m.cod).join(', ')+' ('+P.id+')','não cabe','ped',{id:P.id,tab:'moveis'});toast('Medição registrada: '+bad.length+' móvel(is) não cabe(m). O portão ficará barrado.',1)}else toast('Medição registrada. Tudo cabe.');render()},
 /* revisões */
 revNova(){ask('Nova revisão',[{l:'Motivo',k:'m'}],'Criar REV',v=>{if(!v.m){toast('A revisão precisa de motivo.',1);return}const P=ped();P.rev++;P.revs.unshift({n:'REV '+String(P.rev).padStart(2,'0'),m:v.m,q:now()});P.moveis.forEach(m=>{if(m.status==='aprovado')m.status='conferido'});P.lotes.forEach(l=>{if(l.st!=='liberado')l.st='rascunho'});toast('REV criada. Móveis aprovados voltam para conferido.');render()})},
 /* lotes */
 loteNovo(){const P=ped();const ap=P.moveis.filter(m=>!P.lotes.some(l=>l.mov.includes(m.cod)));if(!ap.length){toast('Todos os móveis já estão em lotes.',1);return}
  ask('Novo lote',[{l:'Móveis (todos os ainda sem lote)',k:'x',t:'text',v:ap.map(m=>m.cod).join(', ')}],'Criar lote',()=>{P.lotes.push({id:'LOTE-'+String(P.lotes.length).padStart(2,'0'),mov:ap.map(m=>m.cod),st:'rascunho',por:''});render()})},
 termoSet(d,el){ped().termo=el.checked;render()},
 loteLiberar(d){const P=ped();const l=P.lotes[+d.i];l.st='liberado';l.por=S.user;evt('Lote '+l.id+' liberado ('+P.id+')','lote','docs',{id:P.id,i:d.i});toast('Lote liberado por '+S.user);render()},
 /* IA P1b */
 iaPed(d,el){S.ia.ped=el.value;const P=S.pedidos.find(x=>x.id===S.ia.ped);S.ia.cod=(P.moveis[0]||{}).cod;S.ia.fase=0;render()},
 iaMov(d,el){S.ia.cod=el.value;S.ia.fase=0;render()},
 iaLer(){S.ia.fase=1;render();const prx=[()=>{S.ia.fase=2;render()},()=>{S.ia.fase=3;render()}];setTimeout(prx[0],900);setTimeout(prx[1],1900)},
 iaAprovar(){const P=S.pedidos.find(x=>x.id===S.ia.ped);const m=P.moveis.find(x=>x.cod===S.ia.cod);Object.assign(m,{larg:3200,alt:720,prof:560,prat:2,portas:4,ia:true,status:'rascunho'});
  const ex=S.duvidas.find(x=>x.ped===P.id&&x.txt.includes('profundidade'));if(!ex)S.duvidas.unshift({id:uid('D-'),ped:P.id,txt:'Profundidade do '+m.cod+' não está no desenho (suposta 560 mm).',para:'arquiteto',st:'aberta',resp:''});
  evt('Ficha proposta pela IA aprovada: '+m.cod,'ficha','ped',{id:P.id,tab:'moveis'});toast('Ficha aprovada. O que faltou virou dúvida "para quem".');go('ped',{id:P.id,tab:'moveis'})},
 iaRecusa(){S.ia.fase=0;toast('Proposta recusada. Nada foi gravado.');render()},

 v3(d){S.p[d.k]=!S.p[d.k];render()},
 modo(d){S.p.modo=d.m;render()},

 etiquetas(){const P=ped();const l=P.lotes[+S.p.i];const pcs=loteMoveis(P,l).flatMap(pecas).slice(0,6);ask('Etiquetas (primeiras 6)',[{l:'Prévia',k:'x',t:'text',v:pcs.map(p=>`<div class="card" style="margin-bottom:6px">${esc(p.id)} · ${esc(p.n)}<br><small class="mu">${p.h} × ${p.w} · ${esc(p.mat)}</small></div>`).join('')}],'Fechar',()=>{})},
 /* estoque */
 minSet(d,el){S.estoque[+d.i].min=num(el.value);render()},
 ligSet(d,el){S.estoque[+d.i].lig=el.value;render()},
 ligOk(d){const e=S.estoque[+d.i];e.lig=e.sug;toast('Ligação confirmada: '+e.cod+' → '+e.lig);render()},
 reqGerar(){const falta=[];S.estoque.forEach(e=>{if(e.disp-e.comp<e.min)falta.push({n:e.nome,q:Math.max(e.min-(e.disp-e.comp),1)*2,un:e.un})});S.req={itens:falta,st:'rascunho'};render()},

 cabe(d,el){S.p.ped=el.value;render()},
 /* chat */

 classif(d){classificar(S.leads.find(l=>l.id===d.id));render()},

 leadModelo(d){const l=lead();l.rascunho='Olá! Obrigado pelo contato com a K2K. Pode nos enviar a planta e o endereço da obra? Retornamos em breve. (modelo aprovado pela K2K)';render()},
 leadIA(d){const l=lead();l.rascunho='Olá! Que bom receber seu contato. Para começarmos, poderia enviar a planta em PDF? (rascunho da IA, sem preço nem prazo)';render()},
 leadOrc(d){const l=lead();const id='O-'+String(104+S.orcs.length-3).padStart(4,'0');S.orcs.unshift({id,nome:'Lead '+l.nome+' (rascunho)',estado:'em orçamento',versao:1,base:'medida',mercado:'BR',dir:'A',perc:{neg:'',rt:'',noturno:'',nf:'',ipi:''},itens:[],versoes:[{v:1,quando:now(),motivo:'veio do atendimento'}]});l.st='virou orçamento';toast('Rascunho de orçamento criado');go('orc',{id,tab:'itens'})},

 leadEnc(d){const l=lead();l.st='encaminhado';toast('Encaminhado: '+l.cat+'. Aviso enviado.');evt('Contato encaminhado para '+l.cat,'atendimento','atend',{});render()},
 atRegra(d,el){S.regrasAt[d.k]=d.k==='minConf'?num(el.value):el.value;render()},
 /* dúvidas */
 duvNova(){ask('Nova dúvida',[{l:'Pedido',k:'p',t:'select',o:S.pedidos.map(p=>p.id)},{l:'Para quem',k:'q',t:'select',o:['cliente','arquiteto','projetista','fábrica','diretoria']},{l:'Pergunta',k:'t'}],'Abrir dúvida',v=>{if(!v.t){toast('Escreva a pergunta.',1);return}S.duvidas.unshift({id:uid('D-'),ped:v.p,txt:v.t,para:v.q,st:'aberta',resp:''});evt('Dúvida aberta para '+v.q+' ('+v.p+')','dúvida','duvidas',{});render()})},

 iaProv(d,el){S.regrasAt.ia=el.value;toast('Provedor de IA: '+el.value);render()},
 senha(){ask('Trocar a senha',[{l:'Senha atual',k:'a'},{l:'Nova senha (mínimo 8 caracteres)',k:'n'}],'Trocar',v=>{if((v.n||'').length<8){toast('Mínimo de 8 caracteres.',1);return}toast('Senha trocada')})}

const orc=()=>S.orcs.find(o=>o.id===S.p.id);const ped=()=>S.pedidos.find(p=>p.id===S.p.id);const mov=()=>ped().moveis.find(m=>m.cod===S.p.cod);const lead=()=>S.leads.find(l=>l.id===S.p.l);
function baixar(nome,txt){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+txt],{type:'text/csv'}));a.download=nome;a.click();toast('Arquivo gerado: '+nome)}
/* atendimento */
function classificar(l){const R=S.regrasAt;const t=l.txt.toLowerCase();const has=s=>s.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean).some(w=>t.includes(w));l.passos=[];
 const inj=/ignore|libere|me passe|esqueça as regras|diretoria/.test(t);
 if(inj){l.passos.push('Texto suspeito: pede para ignorar regras. Tratado só como dado.');l.cat='para conferir';l.conf=40;l.st='para conferir';l.passos.push('Confiança baixa: vai para uma pessoa.');return}
 if(has(R.recusa)){l.passos.push('1. Regras fixas: bate com recusa → fora do perfil');l.cat='fora do perfil';l.conf=99;l.st='classificado';return}
 if(has(R.rh)){l.passos.push('1. Regras fixas: currículo → RH');l.cat='RH';l.conf=99;l.st='classificado';return}
 if(has(R.compras)){l.passos.push('1. Regras fixas: fornecedor → Compras');l.cat='Compras';l.conf=99;l.st='classificado';return}
 l.passos.push('1. Regras fixas: sem resultado');
 if(R.ia==='desligada'){l.passos.push('IA desligada: vai para uma pessoa');l.cat='para conferir';l.conf=0;l.st='para conferir';return}
 const lead=has(R.lead);const conf=lead?91:48;l.passos.push('2. IA '+(R.ia==='local'?'local (Ollama)':'Haiku')+': '+(lead?'lead':'incerto')+' ('+conf+'%)');
 if(conf<R.minConf){l.passos.push('3. Confiança abaixo de '+R.minConf+'%: vai para uma pessoa');l.cat='para conferir';l.conf=conf;l.st='para conferir';return}
 l.cat='lead qualificado';l.conf=conf;l.st='classificado'}
/* chatbot */
function chatEnviar(t){S.chat.push({r:'me',h:t});const x=t.toLowerCase();
 const P=S.pedidos.find(p=>x.includes(p.id.toLowerCase())||x.includes(p.nome.toLowerCase().split(' ')[0]));
 const b=(h,src,extra={})=>S.chat.push({r:'bot',h,src,...extra});
 if(/libera.*lote|liberar.*lote|libere/.test(x))b('Isso eu <b>nunca faço</b>. Só a diretoria libera o lote, na tela do pedido.','',{red:1});
 else if(/abre.*d[uú]vida|abrir.*d[uú]vida/.test(x)){const q=/arquiteto/.test(x)?'arquiteto':/cliente/.test(x)?'cliente':'projetista';const pp=P||S.pedidos[0];b('Posso fazer isto. Confirme antes de eu executar:','',{conf:{tit:'Abrir dúvida',det:'Pedido '+pp.id+' · para: '+q+' · "'+t.replace(/^.*?(sobre|:)/i,'').trim()+'"'},ação:()=>{S.duvidas.unshift({id:uid('D-'),ped:pp.id,txt:t.replace(/^.*?(sobre|:)/i,'').trim()||'Dúvida aberta pelo chatbot',para:q,st:'aberta',resp:''});evt('Dúvida aberta pelo chatbot ('+pp.id+')','dúvida','duvidas',{})}})}
 else if(/muda.*estado|mudar.*estado/.test(x)){const o=S.orcs.find(o=>o.estado==='em orçamento');if(o)b('Posso marcar o orçamento <b>'+o.id+'</b> como enviado. Confirme:','',{conf:{tit:'Mudar estado',det:o.id+': em orçamento → enviado'},ação:()=>{o.estado='enviado';evt('Orçamento '+o.id+' enviado pelo chatbot (com confirmação)','orçamento','orc',{id:o.id,tab:'itens'})}});else b('Não há orçamento em "em orçamento".')}
 else if(/cobra|cobrar/.test(x)){const d=S.duvidas.find(d=>d.st==='aberta');if(d)b('Posso cobrar a resposta da dúvida <b>'+d.id+'</b> (para '+d.para+'). Confirme:','',{conf:{tit:'Cobrar resposta',det:d.txt},ação:()=>evt('Cobrança da dúvida '+d.id+' enviada','dúvida','duvidas',{})});else b('Não há dúvida aberta.')}
 else if(/estoque/.test(x)){b('O programa permite apenas consultar a planilha de estoque existente, em modo de leitura.','planilhas de estoque');}
 else if(/or[cç]amento/.test(x)){const a=S.orcs.filter(o=>o.estado==='em orçamento'||o.estado==='enviado');b('Orçamentos abertos: '+a.map(o=>o.id+' ('+o.estado+')').join(', ')+'.','orçamentos')}
 else if(/d[uú]vida/.test(x)){const a=S.duvidas.filter(d=>d.st==='aberta');b('Dúvidas abertas: '+a.length+'. '+a.map(d=>d.id+' para '+d.para).join(', ')+'.','dúvidas')}
 else if(P){const c=P.moveis.flatMap(m=>conferir(m).filter(z=>z.nivel==='erro'));b('<b>'+P.id+'</b> ('+esc(P.nome)+'): '+P.moveis.length+' móveis, REV '+P.rev+', '+P.lotes.filter(l=>l.st==='liberado').length+' lote(s) liberado(s), '+c.length+' erro(s) de conferência.','pedido '+P.id)}
 else b('Entendo estas coisas: estado de um pedido, orçamentos abertos, dúvidas, estoque, abrir dúvida, mudar estado, cobrar resposta. Liberar lote eu não faço.');
 render();const c=document.querySelector('.chat');if(c)c.scrollTop=c.scrollHeight}

const MATLIG={'MDF branco TX 18 mm':'#4821','MDF branco TX 6 mm':'#4822'};
function cabeEstoque(P){const mv=P.moveis;const ch=chapasDe(mv);const r=[];for(const [mat,ss] of Object.entries(ch)){const e=S.estoque.find(x=>stockNorm(x.lig||x.nome)===stockNorm(mat));if(!e)r.push({n:mat,prec:ss.length,res:'sem ligação'});else{const lv=e.disp-e.comp;r.push({n:mat,prec:ss.length,disp:lv,res:lv>=ss.length?'tem ('+ss.length+' de '+lv+')':'falta '+(ss.length-lv)})}}
 const dob=mv.reduce((a,m)=>a+m.portas*2,0),corr=mv.reduce((a,m)=>a+m.gav,0);const ed=S.estoque.find(x=>x.cod==='#7399'||/dobradic/.test(stockNorm(x.nome))),ec=S.estoque.find(x=>x.cod==='#7310'||/corredic/.test(stockNorm(x.nome)));
 r.push(ed&&ed.lig?{n:'Dobradiças',prec:dob,disp:ed.disp-ed.comp,res:ed.disp-ed.comp>=dob?'tem':'falta '+(dob-(ed.disp-ed.comp))}:{n:'Dobradiças',prec:dob,res:'sem ligação'});
 r.push(ec&&ec.lig?{n:'Corrediças',prec:corr,disp:ec.disp-ec.comp,res:ec.disp-ec.comp>=corr?'tem':'falta '+(corr-(ec.disp-ec.comp))}:{n:'Corrediças',prec:corr,res:'sem ligação'});return r}

 <div class="paper"><div class="mono">K2K Marcenaria · ${usa?'Proposal':'Proposta'}</div><h3 style="margin-top:26px">${esc(o.nome)}</h3><div class="mono" style="margin-bottom:18px">${o.id} · versão ${o.versao} · direção ${o.dir}</div><div style="margin-bottom:14px"><span class="sw" style="background:#f2f0ea"></span><span class="sw" style="background:${o.dir==='A'?'#c9c3b6':'#8a6a45'}"></span><span class="sw" style="background:#3b3a38"></span></div>${o.itens.map(i=>`<div class="rl"><span>${i.cod} · ${i.terc?'<i>'+esc(i.nome)+' (terceiro, fora do valor)</i>':esc(tabItem(i.t).nome)+(usa?' · '+(num(i.med)*39.37).toFixed(0)+' in':'')}</span><b>${i.terc?'':val(valorItem(i)*(o.dir==='B'?1.22:1))}</b></div>`).join('')}<div class="rl" style="border:0;font-size:17px;margin-top:8px"><span>Total</span><b>${val(tt.total)}</b></div>${usa?'<div class="rl"><span>Pagamento</span><span>40% / 40% / 20%</span></div><div class="rl"><span>Frete e NCM</span><span>a informar</span></div>':'<div class="rl"><span>Condições</span><span>a informar pela diretoria</span></div>'}</div>`}
T.tabela=()=>head('Tabela de preços','Orçamentos › tabela',B('Salvar com histórico','tabSalvar',{},'','liberar'))+`<div class="body"><div class="col"><div class="card"><span class="chip a">valores de exemplo, não são os da K2K</span> Itens por m², ml ou un. Mínimo de 1 m² ou 1 ml.</div><table><tr><th>Código</th><th>Item</th><th>Un</th><th class="n">Preço</th></tr>${S.tabela.map((t,i)=>`<tr><td>${t.id}</td><td>${esc(t.nome)}</td><td>${t.un}</td><td class="n"><input style="width:110px;text-align:right" data-a="tabSet" data-ch="1" data-i="${i}" value="${t.preco}" ${can('liberar')?'':'disabled'}></td></tr>`).join('')}</table></div><div class="side"><div class="lbl">Histórico</div>${S.tabHist.map(h=>`<div class="card"><b>${esc(h.d)}</b><br><small class="mu">${esc(h.por)} · ${esc(h.n)}</small></div>`).join('')}<small class="mu">Só diretoria e admin editam (D8: qual tabela vale, a decidir).</small></div></div>`;
T.projetos=()=>head('Projetos','P1 a P8',B('+ Novo projeto','nav',{s:'novoProj'},'','projetar')+B('IA lê as pranchas','nav',{s:'ia'},'s','projetar'))+`<div class="body"><div class="col"><table><tr><th>Pedido</th><th>Obra</th><th>Móveis</th><th>REV</th><th>Lotes</th><th>Erros</th><th></th></tr>${S.pedidos.map(p=>`<tr><td>${p.id}</td><td>${esc(p.nome)}</td><td>${p.moveis.length}</td><td>${p.rev}</td><td>${p.lotes.filter(l=>l.st==='liberado').length}/${p.lotes.length}</td><td>${p.moveis.reduce((a,m)=>a+conflitos(m),0)?chip('r',p.moveis.reduce((a,m)=>a+conflitos(m),0)+' erro(s)'):chip('g','ok')}</td><td class="n">${B('Abrir','nav',{s:'ped',p:JSON.stringify({id:p.id,tab:'moveis'})},'s sm')}</td></tr>`).join('')}</table></div></div>`;
T.novoProj=()=>head('Novo projeto','Projetos › novo',B('Cancelar','nav',{s:'projetos'},'s'))+`<div class="body"><div class="col"><div class="card"><div class="lbl">Pasta da obra (digite o caminho)</div><div style="display:flex;gap:8px"><input id="pp" value="${esc(S.p.lido||'')}" placeholder="Ex.: C:\\obras\\pasta-da-obra"><button class="btn" data-a="lerPasta">Ler pasta</button></div><small class="mu">O programa nunca abre janela de escolher pasta.</small></div>${S.p.lido?`<div class="card"><div class="lbl">O que foi lido</div><table><tr><th>Arquivo</th><th>Tipo</th><th>Papel</th></tr>${[['projeto.skp','SketchUp','PROJETOS ORIGINAIS'],['planta.dwg','DWG','PROJETOS ORIGINAIS'],['pranchas-moveis.pdf','PDF','PROJETOS ORIGINAIS'],['medicao-fotos (12)','imagens','MEDIÇÃO E ATAS'],['antigo-backup.skp','SketchUp','DESATUALIZADO (fica fora)']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table></div><div class="card"><div class="lbl">Dados preenchidos, com a fonte</div><div class="grid g2"><div>Obra <b>Obra de exemplo</b><br><small class="mu">fonte: nome da pasta</small></div><div>Arquiteto <b>a confirmar</b><br><small class="mu">fonte: carimbo da prancha</small></div></div></div>${B('Criar pedido','criarPedido',{},'','projetar')}`:''}</div></div>`;
T.ped=()=>{const P=ped();const tab=S.p.tab||'moveis';const tabs=['moveis','dúvidas','medição','revisões','lotes'];let body='';
 if(tab==='moveis')body=`<table><tr><th>Código</th><th>Móvel</th><th>Medidas</th><th>Estado</th><th>Conferência</th><th></th></tr>${P.moveis.map(m=>{const c=conferir(m);const er=c.filter(x=>x.nivel==='erro').length,av=c.filter(x=>x.nivel==='aviso').length;return `<tr><td>${m.cod}</td><td>${esc(m.nome)}${m.ia?' '+chip('v','ficha da IA'):''}</td><td>${m.larg}×${m.alt}×${m.prof}</td><td>${chip(estCls[m.status],m.status)}</td><td>${er?chip('r',er+' erro(s)'):''} ${av?chip('a',av+' aviso(s)'):''} ${!er&&!av?chip('g','ok'):''}</td><td class="n"><button class="btn s sm" data-a="nav" data-s="movel" data-p='${JSON.stringify({id:P.id,cod:m.cod})}'>Ficha</button> <button class="btn s sm" data-a="nav" data-s="v3d" data-p='${JSON.stringify({id:P.id,cod:m.cod,modo:'Ver'})}'>3D</button> <button class="btn s sm" data-a="nav" data-s="conf" data-p='${JSON.stringify({id:P.id,cod:m.cod})}'>Conferir</button></td></tr>`}).join('')||'<tr><td colspan=6 class="mu">Sem móveis. Use a IA que lê as pranchas ou adicione.</td></tr>'}</table><div style="margin-top:10px">${B('+ Móvel','movAdd',{},'s','projetar')}${B('IA lê as pranchas','nav',{s:'ia',p:JSON.stringify({})},'s','projetar')}</div>`;
 if(tab==='dúvidas'){const d=S.duvidas.filter(x=>x.ped===P.id);body=d.map(x=>`<div class="row"><div class="bar" style="background:var(--${x.st==='aberta'?'am':'li'})"></div><div class="t"><b>${esc(x.txt)}</b><span>para ${esc(x.para)}${x.resp?' · resposta: '+esc(x.resp):''}</span></div>${chip(x.st==='aberta'?'a':'g',x.st)}${x.st==='aberta'?B('Responder','duvResp',{id:x.id},'s sm'):''}</div>`).join('')||'<div class="card mu">Sem dúvidas.</div>'}
 if(tab==='medição'){const M=P.med;body=`<div class="grid g2"><div class="card"><div class="lbl">Checklist</div>${Object.keys(M.ck).map(k=>`<label style="display:block;margin:6px 0"><input type="checkbox" data-a="ckSet" data-ch="1" data-k="${esc(k)}" ${M.ck[k]?'checked':''} ${can('medir')?'':'disabled'}> ${esc(k)}</label>`).join('')}</div><div class="card"><div class="lbl">Cotas (vale a da obra)</div><table><tr><th>Vão</th><th class="n">Projeto</th><th class="n">Obra</th><th></th></tr>${M.cotas.map((c,i)=>`<tr><td>${esc(c.t)}</td><td class="n">${c.proj}</td><td class="n"><input style="width:80px;text-align:right" data-a="cotaSet" data-ch="1" data-i="${i}" value="${c.obra}" ${can('medir')?'':'disabled'}></td><td>${c.obra<c.proj?chip('r','menor'):c.obra>c.proj?chip('a','maior'):chip('g','igual')}</td></tr>`).join('')}</table></div></div><div class="card"><div class="lbl">Assinatura do responsável da obra</div><input data-a="assin" data-ch="1" value="${esc(M.assin)}" placeholder="Nome de quem assina" ${can('medir')?'':'disabled'}></div>${B('Registrar medição','medRegistrar',{},'','medir')}<p class="mu" style="margin-top:8px">A medida da obra vale mais que o projeto. Um "não cabe" barra o portão.</p>`}
 if(tab==='revisões')body=`${B('Nova revisão','revNova',{},'','projetar')}<div style="margin-top:10px">${P.revs.map(r=>`<div class="row"><div class="t"><b>${r.n}</b><span>${esc(r.m)} · ${esc(r.q)}</span></div></div>`).join('')||'<div class="card mu">Sem revisões.</div>'}</div>`;
 if(tab==='lotes'){body=`<div class="card"><label><input type="checkbox" data-a="termoSet" data-ch="1" ${P.termo?'checked':''} ${can('projetar')?'':'disabled'}> Termo de aprovação assinado pelo cliente</label></div>${B('+ Novo lote','loteNovo',{},'s','projetar')}<div style="margin-top:12px">${P.lotes.map((l,i)=>{const ms=loteMoveis(P,l);const rz=[];ms.forEach(m=>{if(m.status!=='aprovado')rz.push(m.cod+' não aprovado');if(conflitos(m))rz.push(m.cod+' com erro (não cabe ou regra)')});if(!P.termo)rz.push('falta o termo do cliente');const dv=S.duvidas.filter(d=>d.ped===P.id&&d.st==='aberta'&&d.para==='fábrica').length;if(dv)rz.push(dv+' dúvida(s) para a fábrica');const cb=[];
  return `<div class="card"><b>${l.id}</b> ${chip(l.st==='liberado'?'g':'a',l.st)} <span class="mu">${l.mov.join(', ')}</span>${l.st==='liberado'?`<br><small class="mu">liberado por ${esc(l.por)}</small>`:''}<div style="margin:8px 0">${rz.map(r=>`<div class="no">✗ ${esc(r)}</div>`).join('')||'<div class="ok">✓ Portão livre</div>'}${cb.length?`<div class="am">⚠ Estoque: ${cb.map(c=>c.n+' '+c.res).join(', ')} (só avisa, não barra)</div>`:''}</div>${l.st==='liberado'?B('Plano de corte','nav',{s:'corte',p:JSON.stringify({id:P.id,i:i})},'s')+' '+B('Documentos da fábrica','nav',{s:'docs',p:JSON.stringify({id:P.id,i:i})},''):B('Liberar lote para a fábrica','loteLiberar',{i:i},'','liberar').replace('<button',rz.length?'<button disabled title="O portão está barrado"':'<button')}</div>`}).join('')||'<div class="card mu">Nenhum lote ainda.</div>'}</div><small class="mu">Só diretoria e admin liberam. O chatbot nunca libera.</small>`}
 return head(`${P.id} · ${esc(P.nome)}`,crumbTo('projetos','Projetos')+' › '+P.id,chip('','REV '+P.rev)+(P.orc!=='—'?B('Orçamento '+P.orc,'nav',{s:'orc',p:JSON.stringify({id:P.orc,tab:'itens'})},'s'):''))+`<div class="body"><div class="col"><div class="tabs">${tabs.map(t=>`<button class="${t===tab?'on':''}" data-a="tab" data-t="${t}">${t}${t==='dúvidas'?' ('+S.duvidas.filter(x=>x.ped===P.id&&x.st==='aberta').length+')':''}</button>`).join('')}</div>${body}</div></div>`};
T.movel=()=>{const P=ped(),m=mov();const c=conferir(m);const pc=pecas(m);const fl=(k,l,u)=>`<div><div class="lbl">${l}</div><input data-a="fichaSet" data-ch="1" data-k="${k}" value="${m[k]}" ${can('projetar')?'':'disabled'}><small class="mu">${u||'mm'}</small></div>`;
 return head(`${m.cod} · ${esc(m.nome)}`,crumbTo('projetos','Projetos')+' › '+crumbTo('ped','Pedido '+P.id,{id:P.id,tab:'moveis'})+' › ficha',chip(estCls[m.status],m.status)+B('3D','nav',{s:'v3d',p:JSON.stringify({id:P.id,cod:m.cod,modo:'Ver'})},'s')+B('Aprovar móvel','fichaAprovar',{},'','projetar'))+`<div class="body"><div class="col"><div class="card"><div class="lbl">Editor da ficha · cada número tem origem</div><div class="grid g4">${fl('larg','Largura')}${fl('alt','Altura')}${fl('prof','Profundidade')}${fl('esp','Espessura')}${fl('prat','Prateleiras','un')}${fl('portas','Portas','un')}${fl('gav','Gavetas','un')}${fl('vao','Vão da obra')}</div><div style="margin-top:10px"><label><input type="checkbox" data-a="fichaSet" data-ch="1" data-k="led" ${m.led?'checked':''}> Fita de LED com fonte</label> &nbsp; <label><input type="checkbox" data-a="fichaSet" data-ch="1" data-k="vent" ${m.vent?'checked':''}> Fonte ventilada</label></div></div><div class="card"><div class="lbl">Peças geradas da ficha (${pc.length})</div><table><tr><th>Peça</th><th>Nome</th><th class="n">Medida</th><th>Material</th></tr>${pc.map(p=>`<tr><td>${p.id}</td><td>${p.n}</td><td class="n">${p.h} × ${p.w}</td><td>${esc(p.mat)}</td></tr>`).join('')}</table></div></div><div class="side"><div class="lbl">Conferência</div>${c.map(x=>`<div class="card"><span class="dot" style="background:var(--${x.nivel==='erro'?'vm':x.nivel==='aviso'?'am':'az'})"></span><b>${x.id}</b> ${esc(x.msg)}<br><small class="mu">${x.nivel==='erro'?'marcado em vermelho, sem corrigir sozinho':'a projetista decide'}</small></div>`).join('')||'<div class="card ok">Sem avisos.</div>'}<div class="card"><div class="lbl">Origem</div>${m.ia?chip('v','lido pela IA (aprovado)'):chip('g','digitado')} ${m.vao?chip('b','vão: medição'):''}</div></div></div>`};
function iso(P){return(x,y,z)=>[(x-y)*0.866*P,(x+y)*0.5*P-z*P]}
T.v3d=()=>{const P=ped(),m=mov();const modo=S.p.modo||'Ver';const ab=!!S.p.ab,ex=!!S.p.ex,led=!!S.p.led;const sc=380/Math.max(m.larg,m.alt,m.prof)/1.0;const pr=iso(sc*0.9);const o=[260,170];
 const poly=(pts,f,s,op=1)=>`<polygon points="${pts.map(p=>(p[0]+o[0]+120).toFixed(0)+','+(p[1]+o[1]+120).toFixed(0)).join(' ')}" fill="${f}" stroke="${s}" stroke-width="1.5" fill-opacity="${op}"/>`;
 const box=(x,y,z,w,d,h,c,s='#2f4a1c',op=1)=>{const a=pr(x,y,z+h),b=pr(x+w,y,z+h),cc=pr(x+w,y+d,z+h),dd=pr(x,y+d,z+h),e=pr(x+w,y,z),f=pr(x+w,y+d,z),g=pr(x,y+d,z);return poly([a,b,cc,dd],c,s,op)+poly([dd,cc,f,g],c,s,op*.8)+poly([b,cc,f,e],c,s,op*.65)};
 const W=m.larg,Dp=m.prof,H=m.alt,e=m.esp,gap=ex?60:0;let s='';const col=modo==='Técnico'?'#16283a':modo==='Fábrica'?'#33290f':'#25302a';const st=modo==='Técnico'?'#4db3ff':modo==='Fábrica'?'#ffb648':'#7ed321';
 const er=conflitos(m)>0&&modo==='Revisões';const c2=er?'#33191a':col,s2=er?'#ff7a5c':st;
 s+=box(0,0,0,W,Dp,e,c2,s2);s+=box(0,0,H+gap*2-e,W,Dp,e,c2,s2);s+=box(-gap,0,e,e,Dp,H-2*e+gap*2,c2,s2);
 for(let i=1;i<=m.prat;i++){const z=e+(H-2*e)*i/(m.prat+1)+gap;s+=box(e,0,z,W-2*e,Dp-20,e,c2,s2,.9)}
 s+=box(W-e+gap,0,e,e,Dp,H-2*e+gap*2,c2,s2);
 if(led)s+=poly([pr(e,Dp-10,H-e),pr(W-e,Dp-10,H-e),pr(W-e,Dp-10,H-e-30),pr(e,Dp-10,H-e-30)].map(p=>p),'#d8ff7a','#a6ee4c',.9);
 const n=Math.max(m.portas,1);for(let i=0;i<n&&m.portas;i++){const pw=W/n;const x0=i*pw;const ang=ab?(i%2?-1:1)*Math.min(pw,420)*.7:0;const f=ab?(i%2?'#2a3340':'#2a3340'):'#2c3a2a';s+=ab?box(x0+(i%2?pw-4:0),-ang*0.6,0,4,pw*.8,H,f,st,.85):box(x0+2,-4,2,pw-4,4,H-4,f,st,.95)}
 const tb=['Ver','Montar','Técnico','Revisões','Fábrica'];
 return head(`3D · ${m.cod} ${esc(m.nome)}`,crumbTo('projetos','Projetos')+' › '+crumbTo('ped',P.id,{id:P.id,tab:'moveis'})+' › 3D',B('Ficha','nav',{s:'movel',p:JSON.stringify({id:P.id,cod:m.cod})},'s'))+`<div class="body"><div class="col" style="display:flex;flex-direction:column"><div class="tabs">${tb.map(x=>`<button class="${x===modo?'on':''}" data-a="modo" data-m="${x}">${x}</button>`).join('')}<span style="flex:1"></span><button class="btn ${ab?'':'s'} sm" data-a="v3" data-k="ab">${ab?'Fechar portas':'Abrir portas'}</button><button class="btn ${ex?'':'s'} sm" data-a="v3" data-k="ex">${ex?'Juntar':'Explodida'}</button><button class="btn ${led?'':'s'} sm" data-a="v3" data-k="led">LED</button></div><div class="scene" style="flex:1;min-height:420px"><svg viewBox="0 0 760 520" style="width:100%;height:100%">${s}</svg><div style="position:absolute;left:12px;bottom:10px" class="chip">${modo}${modo==='Montar'?' · passo a passo: base, laterais, prateleiras, topo, portas':''}</div></div></div><div class="side"><div class="lbl">Medidas</div><div class="card">${m.larg} × ${m.alt} × ${m.prof} mm<br><small class="mu">espessura ${m.esp} mm</small></div><div class="lbl">Conferência</div>${conferir(m).map(x=>`<div class="card"><span class="dot" style="background:var(--${x.nivel==='erro'?'vm':'am'})"></span>${x.id} ${esc(x.msg)}</div>`).join('')||'<div class="card ok">Sem avisos</div>'}<div class="card"><span class="chip">para depois</span> Tour, modo Ilustração, ambiente habitado.</div></div></div>`};
T.conf=()=>{const P=ped();const f=S.p.f||'todas';const ms=S.p.cod?P.moveis.filter(m=>m.cod===S.p.cod):P.moveis;const todos=ms.flatMap(m=>conferir(m).map(x=>({...x,cod:m.cod})));
 return head('Conferência das 37 regras',crumbTo('projetos','Projetos')+' › '+P.id,'')+`<div class="body"><div class="col"><div class="tabs">${['todas','só com aviso'].map(x=>`<button class="${f===x?'on':''}" data-a="confFil" data-f="${x}">${x}</button>`).join('')}</div><table><tr><th>Regra</th><th>Nome</th><th class="n">Limite</th><th>Resultado</th></tr>${S.regras.filter(r=>f==='todas'||todos.some(t=>t.id===r.id)).map(r=>{const t=todos.filter(x=>x.id===r.id);return `<tr><td>${r.id}</td><td>${r.nome}${!r.calc?' <small class="mu">(não prototipada)</small>':''}</td><td class="n">${r.lim??'—'}</td><td>${!r.on?chip('','desligada'):t.length?t.map(x=>chip(x.nivel==='erro'?'r':x.nivel==='aviso'?'a':'b',x.cod+': '+x.msg)).join(' '):chip('g','sem aviso')}</td></tr>`}).join('')}</table></div></div>`};

T.ia=()=>{const I=S.ia;const P=S.pedidos.find(p=>p.id===I.ped);const mv=P.moveis;const f=I.fase;
 const sug=[['Largura',3200,'folha 38, cota 3200','lido'],['Altura',720,'folha 38, cota 720','lido'],['Profundidade',560,'não está no desenho','suposto'],['Prateleiras',2,'folha 39','lido'],['Portas',4,'folha 38','lido']];
